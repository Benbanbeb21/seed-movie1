# GitHub Actions Magnet Link Seeding Bot
# Place this file at: .github/workflows/seed-bot.yml
#
# Workflow:
#   1. Downloads the file from the web seed URL (direct HTTP download)
#   2. Starts aria2c with the magnet link — it detects the pre-downloaded file
#   3. Seeds the torrent to peers indefinitely until the job times out
#
# Runs every 4 hours, each session lasts ~3h 50m before the next one takes over.

name: Seed Magnet Link

on:
  schedule:
    # Every 4 hours: 0:00, 4:00, 8:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch: # Manual trigger from GitHub UI

concurrency:
  group: seed-bot
  cancel-in-progress: true

env:
  WEB_SEED_URL: "https://rd3.seedr.cc/ff_get/5932549471/%5BDCPN%5D%20Detective%20Conan%20-%20Magic%20File%206%20%5B480p%20AVC%20MP3%5D%5B3B7D2F9A%5D.mkv?st=Ecv1Wqc8O6s0fyw5GY7-Zg&e=1780792742"
  TORRENT_FILE_NAME: "[DCPN] Detective Conan - Movie 4 - Captured In Her Eye - Funimation Dub Remastered x265 BD Encode.mkv {Tags:V13;C2;A:en;}"
  MAGNET_URI: "magnet:?xt=urn:btih:414c58ffafcf782396e44f8528ed838ea4714ee8&dn=%5BDCPN%5D%20Detective%20Conan%20-%20Movie%204%20-%20Captured%20In%20Her%20Eye%20-%20Funimation%20Dub%20Remastered%20x265%20BD%20Encode.mkv%20%7BTags%3AV13%3BC2%3BA%3Den%3B%7D&tr=https%3A%2F%2Ftracker.nekobt.to%2Fapi%2Ftracker%2Fpublic%2Fannounce&tr=http%3A%2F%2Fnyaa.tracker.wf%3A7777%2Fannounce"
  DOWNLOAD_DIR: "/home/runner/torrents"

jobs:
  seed:
    name: Download from Web Seed & Seed
    runs-on: ubuntu-latest
    timeout-minutes: 230

    steps:
      - name: Install aria2c + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl

      - name: Create download directory
        run: mkdir -p "${DOWNLOAD_DIR}"

      # ─────────────────────────────────────────────
      # STEP 1: Download the file from the web seed
      # ─────────────────────────────────────────────
      - name: Download file from web seed
        run: |
          echo ">>> Downloading file from web seed..."
          echo ">>> URL: ${WEB_SEED_URL}"
          echo ""

          curl -L \
            --progress-bar \
            --connect-timeout 30 \
            --max-time 600 \
            -o "${DOWNLOAD_DIR}/${TORRENT_FILE_NAME}" \
            "${WEB_SEED_URL}"

          FILE_SIZE=$(stat --printf="%s" "${DOWNLOAD_DIR}/${TORRENT_FILE_NAME}" 2>/dev/null || echo "0")
          echo ""
          echo ">>> Download complete!"
          echo ">>> File: ${TORRENT_FILE_NAME}"
          echo ">>> Size: $(numfmt --to=iec $FILE_SIZE)"

      # ─────────────────────────────────────────────
      # STEP 2: Seed the torrent with the file
      # ─────────────────────────────────────────────
      - name: Create aria2c configuration
        run: |
          cat > ~/aria2.conf << 'EOF'
          # ── General ──────────────────────────────────────────
          dir=/home/runner/torrents
          continue=true
          max-concurrent-downloads=5
          max-connection-per-server=16
          min-split-size=10M
          split=16
          max-tries=5
          retry-wait=10
          connect-timeout=60
          timeout=300
          # ── BitTorrent ──────────────────────────────────────
          seed-ratio=0
          seed-time=99999
          seed-unverified=true
          peer-id-prefix=-qB4600-
          user-agent=qBittorrent/4.6.3
          enable-dht=true
          dht-listen-port=6881
          bt-enable-lpd=true
          enable-peer-exchange=true
          # ── RPC (for monitoring/debug) ───────────────────────
          enable-rpc=true
          rpc-listen-all=false
          rpc-listen-port=6800
          # ── Logging ─────────────────────────────────────────
          log=/home/runner/torrents/aria2.log
          log-level=notice
          EOF

      - name: Seed torrent (runs until timeout)
        run: |
          echo ">>> Starting aria2c — seeding until job timeout kills it..."
          echo ">>> Info hash: 414c58ffafcf782396e44f8528ed838ea4714ee8"
          echo ">>> Pre-downloaded file: ${DOWNLOAD_DIR}/${TORRENT_FILE_NAME}"
          echo ""

          # aria2c will detect the existing file, verify it, and start seeding
          aria2c \
            --conf-path=/home/runner/aria2.conf \
            "${MAGNET_URI}"

      # Log stats on exit
      - name: Log seeding stats
        if: always()
        run: |
          echo "=== aria2 log (last 50 lines) ==="
          tail -n 50 ~/torrents/aria2.log 2>/dev/null || echo "(no log found)"
          echo ""
          echo "=== Downloaded files ==="
          ls -lh ~/torrents/ 2>/dev/null || echo "(no files found)"
          echo ""
          echo "=== RPC stats (best-effort) ==="
          curl -s http://localhost:6800/json 2>/dev/null | head -c 2000 || echo "(rpc not available)"
