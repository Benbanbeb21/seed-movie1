# GitHub Actions Magnet Link Seeding Bot (updated)
# Place this file at: .github/workflows/seed-bot.yml
#
# This workflow runs every 4 hours, installs aria2c and mktorrent,
# downloads the specified direct HTTP file, creates a .torrent from it,
# and then seeds that torrent until the job times out (~3h50m).

name: Seed File and Create Torrent

on:
  schedule:
    # Every 4 hours: 0:00, 4:00, 8:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

concurrency:
  group: seed-bot
  cancel-in-progress: true

jobs:
  seed:
    name: Download, Create Torrent & Seed
    runs-on: ubuntu-latest
    timeout-minutes: 230 # ~3h 50m buffer so next cron doesn't overlap

    steps:
      - name: Install dependencies (aria2, mktorrent)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 mktorrent

      - name: Create download directory
        run: mkdir -p ~/torrents

      - name: Create aria2c configuration
        run: |
          cat > ~/aria2.conf << 'EOF'
          # ── General ──────────────────────────────────────────
          dir=/home/runner/torrents
          continue=true
          max-concurrent-downloads=5
          max-connection-per-server=16
          min-split-size=10M
          split=16
          max-tries=5
          retry-wait=10
          connect-timeout=60
          timeout=300
          # ── BitTorrent ──────────────────────────────────────
          seed-ratio=0
          seed-time=99999
          seed-unverified=true
          peer-id-prefix=-SD2300-
          user-agent=qBittorrent/4.6.3
          enable-dht=true
          dht-listen-port=6881
          bt-enable-lpd=true
          enable-peer-exchange=true
          # ── RPC (optional — for monitoring) ────────────────
          enable-rpc=true
          rpc-listen-all=false
          rpc-listen-port=6800
          # ── Logging ─────────────────────────────────────────
          log=/home/runner/torrents/aria2.log
          log-level=notice
          EOF

      - name: Download file via HTTP
        run: |
          # The direct download URL (wrapped in quotes because it contains special characters)
          FILE_URL='https://rd3.seedr.cc/ff_get/5932549471/[DCPN]%20Detective%20Conan%20-%20Magic%20File%206%20[480p%20AVC%20MP3][3B7D2F9A].mkv?st=Ecv1Wqc8O6s0fyw5GY7-Zg&e=1780792742'

          # Choose a safe filename to write the download as (avoid ? and query params)
          OUTNAME='[DCPN] Detective Conan - Magic File 6 [480p AVC MP3][3B7D2F9A].mkv'

          echo "Downloading to ~/torrents/${OUTNAME} ..."

          # Use aria2c for the HTTP download (resume capable, fast connections)
          aria2c -d /home/runner/torrents -o "${OUTNAME}" -x16 -s16 --allow-overwrite=true "${FILE_URL}"

      - name: Create torrent from downloaded file
        run: |
          FILEPATH=/home/runner/torrents/[DCPN]\\ Detective\\ Conan\\ -\\ Magic\\ File\\ 6\\ \\[480p\\ AVC\\ MP3\\]\\[3B7D2F9A\\].mkv
          TORRENT_OUT=/home/runner/torrents/magic-file-6.torrent

          echo "Creating torrent ${TORRENT_OUT} from ${FILEPATH}"

          # Public tracker list (multiple -a flags)
          mktorrent \
            -a "udp://tracker.openbittorrent.com:80/announce" \
            -a "udp://tracker.opentrackr.org:1337/announce" \
            -a "udp://tracker.leechers-paradise.org:6969/announce" \
            -a "udp://tracker.coppersurfer.tk:6969/announce" \
            -o "${TORRENT_OUT}" "${FILEPATH}"

          echo "Torrent created: ${TORRENT_OUT}"

      - name: Seed torrent (blocks until job timeout)
        run: |
          # Start aria2c with the .torrent file — aria2.conf sets seed-ratio=0 and seed-time=99999
          echo "Starting aria2c to seed the torrent (will run until job timeout)..."
          aria2c --conf-path=/home/runner/aria2.conf /home/runner/torrents/magic-file-6.torrent

      - name: Log seeding stats
        if: always()
        run: |
          echo "=== aria2 log (last 50 lines) ==="
          tail -n 50 ~/torrents/aria2.log 2>/dev/null || echo "(no log found)"
          echo ""
          echo "=== Downloaded files ==="
          ls -lh ~/torrents/ 2>/dev/null || echo "(no files found)"
